<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCAA College Football Standings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#f8f9fa] min-h-screen text-[#202124] font-sans p-2 sm:p-6 flex justify-center items-start">

  <!-- Main Google Sports Card Container -->
  <div class="w-full max-w-2xl bg-white border border-[#dadce0] rounded-xl shadow-sm overflow-hidden my-4">
    
    <!-- Header Bar -->
    <div class="px-4 py-3 border-b border-[#dadce0] flex items-center justify-between bg-white">
      <div class="flex items-center gap-2.5">
        <div class="w-6 h-6 rounded-full bg-[#1a73e8] text-white flex items-center justify-center font-bold text-xs">CFB</div>
        <h1 class="text-base font-medium text-[#202124]">College Football Standings</h1>
      </div>
      <span class="text-xs text-[#5f6368] bg-[#f1f3f4] px-2.5 py-1 rounded-full font-medium">NCAA Division I</span>
    </div>

    <!-- Scrollable Pill Tabs (Google Style) -->
    <div class="px-4 pt-3 pb-2 border-b border-[#f1f3f4] overflow-x-auto no-scrollbar flex gap-2 bg-white" id="pillBar">
      <button onclick="selectConf('sec', this)" class="conf-pill active bg-[#202124] text-white text-xs font-medium px-4 py-1.5 rounded-full whitespace-nowrap transition-all">SEC</button>
      <button onclick="selectConf('big-ten', this)" class="conf-pill bg-[#f1f3f4] text-[#3c4043] hover:bg-[#e8eaed] text-xs font-medium px-4 py-1.5 rounded-full whitespace-nowrap transition-all">Big Ten</button>
      <button onclick="selectConf('acc', this)" class="conf-pill bg-[#f1f3f4] text-[#3c4043] hover:bg-[#e8eaed] text-xs font-medium px-4 py-1.5 rounded-full whitespace-nowrap transition-all">ACC</button>
      <button onclick="selectConf('big-12', this)" class="conf-pill bg-[#f1f3f4] text-[#3c4043] hover:bg-[#e8eaed] text-xs font-medium px-4 py-1.5 rounded-full whitespace-nowrap transition-all">Big 12</button>
      <button onclick="selectConf('pac-12', this)" class="conf-pill bg-[#f1f3f4] text-[#3c4043] hover:bg-[#e8eaed] text-xs font-medium px-4 py-1.5 rounded-full whitespace-nowrap transition-all">Pac-12</button>
    </div>

    <!-- Standings Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs sm:text-sm">
        <thead>
          <tr class="text-[#5f6368] font-medium border-b border-[#f1f3f4] bg-[#f8f9fa]">
            <th class="py-2.5 px-4 font-normal w-full">TEAM</th>
            <th class="py-2.5 px-3 text-center font-normal whitespace-nowrap">CONF</th>
            <th class="py-2.5 px-4 text-center font-normal whitespace-nowrap">OVERALL</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="divide-y divide-[#f1f3f4]">
          <tr>
            <td colspan="3" class="py-8 text-center text-[#70757a]">Loading standings...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // Fallback data in case live feed is updating
    const fallbackData = {
      'sec': [
        { name: 'Georgia Bulldogs', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/61.png', conf: '0-0', overall: '0-0' },
        { name: 'Texas Longhorns', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/251.png', conf: '0-0', overall: '0-0' },
        { name: 'Alabama Crimson Tide', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/333.png', conf: '0-0', overall: '0-0' },
        { name: 'Ole Miss Rebels', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/145.png', conf: '0-0', overall: '0-0' },
        { name: 'LSU Tigers', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/99.png', conf: '0-0', overall: '0-0' },
        { name: 'Tennessee Volunteers', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/2633.png', conf: '0-0', overall: '0-0' },
        { name: 'Missouri Tigers', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/142.png', conf: '0-0', overall: '0-0' },
        { name: 'Oklahoma Sooners', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/201.png', conf: '0-0', overall: '0-0' },
        { name: 'Texas A&M Aggies', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/245.png', conf: '0-0', overall: '0-0' }
      ],
      'big-ten': [
        { name: 'Ohio State Buckeyes', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/194.png', conf: '0-0', overall: '0-0' },
        { name: 'Oregon Ducks', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/2483.png', conf: '0-0', overall: '0-0' },
        { name: 'Penn State Nittany Lions', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/213.png', conf: '0-0', overall: '0-0' },
        { name: 'Michigan Wolverines', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/130.png', conf: '0-0', overall: '0-0' },
        { name: 'USC Trojans', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/30.png', conf: '0-0', overall: '0-0' }
      ],
      'acc': [
        { name: 'Florida State Seminoles', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/52.png', conf: '0-0', overall: '0-0' },
        { name: 'Clemson Tigers', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/228.png', conf: '0-0', overall: '0-0' },
        { name: 'Miami Hurricanes', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/2390.png', conf: '0-0', overall: '0-0' }
      ],
      'big-12': [
        { name: 'Utah Utes', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/254.png', conf: '0-0', overall: '0-0' },
        { name: 'Kansas State Wildcats', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/2306.png', conf: '0-0', overall: '0-0' },
        { name: 'Colorado Buffaloes', logo: 'https://a.espncdn.com/i/teamlogos/ncaa/500/38.png', conf: '0-0', overall: '0-0' }
      ]
    };

    const groupIds = { 'sec': 8, 'big-ten': 4, 'acc': 1, 'big-12': 12, 'pac-12': 9 };
    let currentConf = 'sec';

    function selectConf(confKey, btn) {
      currentConf = confKey;
      document.querySelectorAll('.conf-pill').forEach(b => {
        b.className = 'conf-pill bg-[#f1f3f4] text-[#3c4043] hover:bg-[#e8eaed] text-xs font-medium px-4 py-1.5 rounded-full whitespace-nowrap transition-all';
      });
      btn.className = 'conf-pill active bg-[#202124] text-white text-xs font-medium px-4 py-1.5 rounded-full whitespace-nowrap transition-all';
      loadData(confKey);
    }

    async function loadData(confKey) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '<tr><td colspan="3" class="py-8 text-center text-[#70757a]">Loading live data...</td></tr>';

      const gid = groupIds[confKey] || 8;

      try {
        const response = await fetch(`https://site.api.espn.com/apis/v2/sports/football/college-football/standings?group=${gid}`);
        if (!response.ok) throw new Error("HTTP error");
        const json = await response.json();

        let entries = json.children?.[0]?.standings?.entries || json.standings?.entries || [];

        if (entries.length > 0) {
          renderRows(entries.map((item, i) => ({
            rank: i + 1,
            name: item.team.shortDisplayName || item.team.displayName,
            logo: item.team.logos?.[0]?.href || '',
            conf: getStat(item, ['confWins', 'vsconf', 'wins']) + '-' + getStat(item, ['confLosses', 'losses']),
            overall: getStat(item, ['wins', 'total']) + '-' + getStat(item, ['losses'])
          })));
          return;
        }
      } catch (err) {
        console.warn("Live API empty or blocked, rendering fallback list.");
      }

      // Render Fallback if API returned empty
      const list = fallbackData[confKey] || fallbackData['sec'];
      renderRows(list.map((item, i) => ({
        rank: i + 1,
        name: item.name,
        logo: item.logo,
        conf: item.conf,
        overall: item.overall
      })));
    }

    function getStat(item, names) {
      if (!item.stats) return '0';
      for (let n of names) {
        let s = item.stats.find(x => x.name === n || x.type === n);
        if (s && s.displayValue !== undefined) return s.displayValue;
      }
      return '0';
    }

    function renderRows(rows) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = rows.map(r => `
        <tr class="hover:bg-[#f8f9fa] transition-colors">
          <td class="py-2.5 px-4 flex items-center gap-3">
            <span class="text-xs font-normal text-[#70757a] w-3 text-right">${r.rank}</span>
            <img src="${r.logo}" class="w-5 h-5 object-contain" alt="" onerror="this.style.opacity='0'">
            <span class="font-medium text-[#202124] text-xs sm:text-sm">${r.name}</span>
          </td>
          <td class="py-2.5 px-3 text-center font-medium text-[#202124] text-xs sm:text-sm">${r.conf}</td>
          <td class="py-2.5 px-4 text-center text-[#5f6368] text-xs sm:text-sm">${r.overall}</td>
        </tr>
      `).join('');
    }

    // Initial load
    loadData('sec');
  </script>
</body>
</html>
