<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Football Standings</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-6 font-sans">
  <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-md p-6">
    <h1 class="text-2xl font-bold mb-4 text-center">College Football Standings</h1>
    
    <!-- Conference Selector -->
    <div class="mb-6 flex justify-center">
      <select id="conferenceSelect" onchange="loadStandings()" class="p-2 border rounded-md bg-white shadow-sm font-medium">
        <option value="8">SEC</option>
        <option value="1">ACC</option>
        <option value="4">Big Ten</option>
        <option value="12">Big 12</option>
        <option value="151">American</option>
      </select>
    </div>

    <!-- Standings Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b bg-gray-50">
            <th class="p-3">Team</th>
            <th class="p-3 text-center">Conf</th>
            <th class="p-3 text-center">Overall</th>
          </tr>
        </thead>
        <tbody id="standingsBody">
          <tr><td colspan="3" class="p-4 text-center text-gray-500">Loading standings...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadStandings() {
      const group = document.getElementById('conferenceSelect').value;
      const tbody = document.getElementById('standingsBody');
      tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-gray-500">Loading live data...</td></tr>';

      try {
        const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/college-football/standings?group=${group}`);
        const data = await response.json();
        const entries = data.children[0].standings.entries;

        tbody.innerHTML = entries.map(item => {
          const name = item.team.displayName;
          const logo = item.team.logos[0]?.href || '';
          
          const overallWins = item.stats.find(s => s.name === 'wins')?.displayValue || '0';
          const overallLosses = item.stats.find(s => s.name === 'losses')?.displayValue || '0';
          const confWins = item.stats.find(s => s.name === 'confWins')?.displayValue || '0';
          const confLosses = item.stats.find(s => s.name === 'confLosses')?.displayValue || '0';

          return `
            <tr class="border-b hover:bg-gray-50">
              <td class="p-3 flex items-center gap-3">
                ${logo ? `<img src="${logo}" class="w-6 h-6 object-contain">` : ''}
                <span class="font-semibold">${name}</span>
              </td>
              <td class="p-3 text-center font-medium">${confWins}-${confLosses}</td>
              <td class="p-3 text-center text-gray-600">${overallWins}-${overallLosses}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-red-500">Failed to fetch live standings.</td></tr>';
      }
    }

    loadStandings();
  </script>
</body>
</html>
