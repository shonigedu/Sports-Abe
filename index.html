<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MLS 2026 Standings</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; }
    .table-container { max-width: 650px; margin: 0 auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; text-align: right; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; }
    th:first-child, td:first-child { text-align: left; }
    th { font-weight: bold; background-color: #f8f9fa; }
    .pts { font-weight: bold; color: #1a73e8; }
  </style>
</head>
<body>

<div class="table-container">
  <h2>MLS Eastern Conference (2026)</h2>
  <table>
    <thead>
      <tr>
        <th>Club</th>
        <th>GP</th>
        <th>W</th>
        <th>D</th>
        <th>L</th>
        <th>PTS</th>
      </tr>
    </thead>
    <tbody id="standings-body">
      <!-- Data will render here -->
    </tbody>
  </table>
</div>

<script>
  const rawData = [
    { name: "Chicago Fire", gp: 16, w: 8, d: 2, l: 6, pts: 26 },
    { name: "Columbus Crew", gp: 17, w: 5, d: 4, l: 8, pts: 19 },
    { name: "New England Revolution", gp: 16, w: 9, d: 2, l: 5, pts: 29 },
    { name: "New York Red Bulls", gp: 17, w: 6, d: 4, l: 7, pts: 22 },
    { name: "D.C. United", gp: 17, w: 5, d: 7, l: 5, pts: 22 },
    { name: "Toronto FC", gp: 18, w: 3, d: 8, l: 7, pts: 17 },
    { name: "CF Montréal", gp: 17, w: 4, d: 3, l: 10, pts: 15 },
    { name: "Philadelphia Union", gp: 17, w: 3, d: 4, l: 10, pts: 13 },
    { name: "Orlando City", gp: 17, w: 6, d: 2, l: 9, pts: 20 },
    { name: "NYCFC", gp: 18, w: 7, d: 5, l: 6, pts: 26 },
    { name: "FC Cincinnati", gp: 17, w: 6, d: 5, l: 6, pts: 23 },
    { name: "Atlanta United", gp: 17, w: 3, d: 3, l: 11, pts: 12 },
    { name: "Nashville SC", gp: 17, w: 12, d: 3, l: 2, pts: 39 },
    { name: "Inter Miami CF", gp: 17, w: 11, d: 4, l: 2, pts: 37 },
    { name: "Charlotte FC", gp: 17, w: 7, d: 4, l: 6, pts: 25 }
  ];

  // Sort descending by points (PTS)
  const sortedData = rawData.sort((a, b) => b.pts - a.pts);

  const tbody = document.getElementById("standings-body");
  tbody.innerHTML = sortedData.map((team, i) => `
    <tr>
      <td><b>${i + 1}.</b> ${team.name}</td>
      <td>${team.gp}</td>
      <td>${team.w}</td>
      <td>${team.d}</td>
      <td>${team.l}</td>
      <td class="pts">${team.pts}</td>
    </tr>
  `).join("");
</script>

</body>
</html>
